<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF1F1" />
      <stop offset="50%" stop-color="#FDE8E8" />
      <stop offset="100%" stop-color="#FFF1F1" />
      <animate attributeName="x1" values="-300;300" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;600" dur="1.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="24" fill="url(#shimmer)" />
</svg>
